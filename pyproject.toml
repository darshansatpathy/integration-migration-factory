[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-migration-factory"
version = "0.1.0"
description = "Inventory a legacy integration estate, generate its Kafka replacement from templates, and prove it behaves like the original."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
dependencies = [
  "confluent-kafka>=2.6",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "types-jsonschema"]

[project.scripts]
imf = "imf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imf = ["templates/*.j2"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
max-line-length = 180  # report and message strings; code is formatted at 140

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["kafka: needs a Kafka broker at IMF_BOOTSTRAP"]

[tool.coverage.run]
source = ["imf"]
